services:
  postgres:
    image: postgres:16-alpine
    container_name: haythive-dock-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: haythive
      POSTGRES_PASSWORD: haythive
      POSTGRES_DB: haythive_dock
    volumes:
      - haythive_dock_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haythive -d haythive_dock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  haythive_dock_pg:
